<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- leaflet css -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
        <!-- leaflet js -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
        <!-- d3 js -->
        <script src = "https://d3js.org/d3.v4.min.js"></script>
        <script src="https://d3js.org/d3-fetch.v1.min.js"></script>
        <!-- website css -->
        <link rel="stylesheet" href="styling.css" />
    </head>
    <body>
        <div class="header">
            <h1>Archaeological Finds in Cork</h1>
        </div>
        <div class = "layout">
            <div id="map"></div>
            <div id="side-panel">
                <div class ="toggle-settings">
                    <section class = "filter-zoom">
                        <h3>Zoom Level</h3>
                        <select id="view-select">
                            <option value = "city">Cork City</option>
                            <option value = "county">Cork County</option>
                            <option value = "europe">Connected Locations</option>
                        </select>
                        <h3>Filter by period</h3>
                        <label>
                            <select id="period-filter">
                                <option value = "all">All</option>
                            </select>
                        </label>
                        <label>
                            <h3>Filter by Material</h3>
                            <select id="material-filter">
                                <option value = "all">All</option>
                            </select>
                        </label>
                    </section>
                </div>
                <div id="artifact-container">
                    <h2>Select an object</h2>
                    <p>Click a marker on the map.</p>
                </div>
            </div>
        </div>
        <script>
            // GLOBAL VARIABLES
            var map = L.map('map').setView(
                [51.89827214341589, -8.474338680952512], 15
            );
            //add osm layer
            L.tileLayer(
                'https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19, attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }
            ).addTo(map);
            
            // GLOBAL VARIABLES
            const MapState = {
                lines: [],
                markers: [],
                lineLayer: L.layerGroup(),
                markerLayer: null,
                connectedLayer: null,
                selectedId: null
            };

            const views = {
                city: {center: [51.89827214341589, -8.474338680952512], zoom: 13},
                county: {center: [52.07884036184116, -8.729119819600545],zoom: 8},
                europe: {center: [50.08730606507962, -4.521471989861161],zoom: 4,}
            };

            let showingConnections = true;

            // HELPER FUNCTIONS
            const makeLatLong = (lat, long) => `${lat}_${long}`;

            function groupByLocation(data){
                const coordMap = {};
                data.forEach(row => {
                    if (!row.site_lat || !row.site_long) return;
                    const lat = parseFloat(row.site_lat);
                    const long = parseFloat(row.site_long);
                    const key = `${lat}, ${long}`;
                    if (!coordMap[key]){
                        coordMap[key] = {lat, long, objects: []};
                    }
                    coordMap[key].objects.push(row);
                });
                return Object.values(coordMap);
            }

            // RENDERING FUNCTIONS
            function createObjectMarkers(data){
                MapState.markerLayer = L.layerGroup();
                const locations = groupByLocation(data);
                locations.forEach(location => {
                    const count = location.objects.length;
                    const marker = L.circleMarker([location.lat, location.long], {
                        radius: count > 15 ? 14 : count > 5 ? 12 : 10, // if ... else if ... else
                        fillColor: "#145523",
                        color: "#0f401b",
                        weight: 1,
                        opacity: 0.8,
                        fillOpacity: 0.8,
                    });
                    // shared identity
                    marker.siteId = makeLatLong(location.lat, location.long);
                    marker.locationData = location;
                    marker.on("click", function(){
                        selectLocation(marker.siteId, location);
                    });
                    marker.bindTooltip(`
                        <h3>${location.objects[0].excavation_site}</h3>
                        <p>${count} objects found</p>
                    `)

                    MapState.markerLayer.addLayer(marker);
                    MapState.markers.push(marker);
                });
                return MapState.markerLayer;
            }

            function createLocationMarkers(data){
               const markerGroup = L.layerGroup();
                const seen = new Set();
                
                data.forEach(row => {
                    if(!row.connected_lat || !row.connected_long) return;
                    const lat = parseFloat(row.connected_lat);
                    const long = parseFloat(row.connected_long);
                    const key = `${lat}, ${long}`;
                    
                    if(seen.has(key)) return;
                    seen.add(key);
                    const marker = L.circleMarker(
                        [lat, long], {
                        radius: 10,
                        fillColor: "#341e7e",
                        color: "#231455",
                        weight: 1,
                        opacity: 0.8,
                        fillOpacity: 0.8
                    });
                    marker.bindTooltip(`<h3>${row.connected_location}</h3>`)
                    markerGroup.addLayer(marker);
                 });
                return markerGroup;
            }

            function createConnectionLines(data){
                MapState.lines = [];
                MapState.lineLayer.clearLayers();
                data.forEach(row => {
                    if (row.site_lat && row.site_long && row.connected_lat && row.connected_long){
                        const line = L.polyline([
                            [parseFloat(row.site_lat), parseFloat(row.site_long)], 
                            [parseFloat(row.connected_lat), parseFloat(row.connected_long)]
                        ],{
                            color: "purple", weight: 2, opacity: 0.15
                        });
                        line.siteId = makeLatLong(row.site_lat, row.site_long);

                        MapState.lines.push(line);
                        MapState.lineLayer.addLayer(line);
                    }
                });
                return MapState.lineLayer;
            }

            // UI FUNCTIONS
            function selectLocation(siteId, location){
                MapState.selectedId = siteId;
                showInSidePanel(location);
                //reset all lines
                MapState.lines.forEach(line => {
                    line.setStyle({opacity: 0.05, weight:2});
                });
                //highlight matching lines
                MapState.lines.forEach(line => {
                    if(line.siteId === siteId){
                        line.setStyle({opacity: 0.9, weight:2});
                    }
                });
                //highlight markers
                MapState.markers.forEach(marker => {
                    marker.setStyle({fillOpacity: marker.siteId === siteId ? 0.9 : 0.3});
                });
            }

            // show content in side panel
            function showInSidePanel(location){
                let html = `<h2>Excavation Site: ${location.objects[0].excavation_site}</h2>`;
                location.objects.forEach(obj => {
                    console.log(obj.id);
                    html += `
                    <div class = "artifact-card">
                        <div class = "artifact-info">
                            <h3>${obj.object}</h3>
                            <b>Material:</b> ${obj.material_category || "Unknown"}<br>
                            <b>Origin:</b> ${obj.connected_location || "Unknown"}<br>
                            <b>Period:</b> ${obj.period_category || "Unknown"}<br>
                            <b>Date:</b> ${obj.period || "Unknown"}<br>
                        </div>
                        <div class = "artifact-img">
                            <img src = "/museum/data/images/${obj.id}.jpg" alt = "${obj.Object}" onerror = this.src="/museum/data/images/nan.jpg">
                        </div>
                    </div>
                    `;
                });
                document.getElementById("artifact-container").innerHTML = html;
            }

            // FILTER SYSTEM LAYER
            function setView(type) {
                switch (type) {
                    case "city":
                        map.flyTo(views.city.center, views.city.zoom);
                        break;
                    case "county":
                        map.flyTo(views.county.center, views.county.zoom);
                        break;
                    case "europe":
                        map.flyTo(views.europe.center, views.europe.zoom);
                        break;
                }
            }
            
            function populatePeriodFilter(data){
                const select = document.getElementById("period-filter");
                const periods = new Set();
                const periodOrder = [
                    "Bronze Age",
                    "Iron Age",
                    "Norman / Medieval",
                    "Post-Medieval / Early Modern",
                    "Modern"
                ];
                const periodRank = {};
                periodOrder.forEach((p, i) =>{
                    periodRank[p] = i;
                });
                data.forEach(d=>{
                    if(d.period_category){
                        periods.add(d.period_category.trim());
                    }
                });
                Array.from(periods).sort((a,b)=>{
                    return(periodRank[a] ?? 999) - (periodRank[b] ?? 999);
                }).forEach(period=>{
                    const option = document.createElement("option");
                    option.value = period;
                    option.textContent = period;
                    select.appendChild(option);
                });
            }

            function populateMaterialFilter(data){
                const select = document.getElementById("material-filter");
                const materials = new Set();
                data.forEach(d=>{
                    if(d.material_category){
                        materials.add(d.material_category.trim());
                    }
                });
                Array.from(materials).sort().forEach(material=>{
                    const option = document.createElement("option");
                    option.value = material;
                    option.textContent = material;
                    select.appendChild(option);
                });
            }           

            function updateMapFilters(){
                if (!allObjects.length) return;

                const selectedPeriod = document.getElementById("period-filter").value;
                const selectedMaterial = document.getElementById("material-filter").value;
                map.removeLayer(objectLayer);
                const filteredObjects = allObjects.filter(d =>{
                    const periodMatch = selectedPeriod === "all" || (d.period_category && d.period_category.trim() === selectedPeriod);
                    const materialMatch = selectedMaterial === "all" || (d.material_category && material_category.trim() === selectedMaterial);
                    return periodMatch && materialMatch;
                });

                objectLayer = createObjectMarkers(filteredObjects);
                objectLayer.addTo(map);
            }
            
            // EVENT LISTENERS
            document.getElementById("period-filter").addEventListener("change", updateMapFilters);
            document.getElementById("material-filter").addEventListener("change", updateMapFilters);
            
            // INITIALISE
            d3.csv("/museum/data/dataset_objects.csv").then(data=>{
                allObjects = data.filter(d => d.site_lat && d.site_long);
                objectLayer = createObjectMarkers(allObjects);

                const connectedLayer = L.layerGroup();
                connectedLayer.addLayer(createLocationMarkers(allObjects));
                connectedLayer.addLayer(createConnectionLines(allObjects));
                
                objectLayer.addTo(map);
                connectedLayer.addTo(map);

                populatePeriodFilter(allObjects);
                populateMaterialFilter(allObjects);

                document.getElementById("view-select").addEventListener("change", function(){
                    setView(this.value);
                });
                document.getElementById("connected-locations-btn").addEventListener("click", function(){
                    if (showingConnections){
                        map.removeLayer(connectedLayer);
                        showingConnections = false;
                        this.textContent = "Show Connections";
                    } else{
                        map.addLayer(connectedLayer);
                        showingConnections = true;
                        this.textContent = "Hide Connections";
                    }
                })
            });
        </script>
    
</html>
